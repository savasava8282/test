[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-alert-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
weather-alert-bot = "weather_alert_bot.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
